name: release-web

# Builds the production SPA (vite, minified) on tag and attaches the bundle to
# the GitHub release, so deploys ship a versioned, reproducible artifact instead
# of rebuilding from source on the operator's machine. The ansible portal_web
# role consumes it via `-e portal_web_dist_tarball=...` (see `just deploy-web-release`).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: false
        default: ""

permissions:
  contents: write   # attach the bundle to the release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # VITE_API_URL is intentionally empty => same-origin. The SPA calls the API
      # on whatever host serves it (Caddy fronts both on one domain), so the
      # bundle is deployment-agnostic. Set it here only for a cross-origin API.
      - name: Build SPA
        run: cd web && npm ci && npm run build
        env:
          VITE_API_URL: ""

      # Rooted INSIDE dist/ so unarchive lands index.html at the docroot top
      # level — matches the portal_web role's own local-build tar.
      - name: Package dist
        run: tar -czf web-dist.tar.gz -C web/dist .

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.tar.gz
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: web-dist.tar.gz
          fail_on_unmatched_files: true
