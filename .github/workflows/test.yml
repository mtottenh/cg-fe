name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Frontend unit tests
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Run unit tests
        run: cd web && npm run test:run

      # `npm run typecheck` uses `-p tsconfig.app.json`, the project config
      # that includes src/**. The old `vue-tsc --noEmit` at repo root picked
      # up the project-references root (with `files: []`) and typechecked
      # nothing. The `build` job below already runs `vue-tsc -b` — this
      # explicit step fails faster with a clearer error.
      - name: Type check
        run: cd web && npm run typecheck

      # `lint` runs with --max-warnings 0: the warning backlog was cleared,
      # so any new warning fails CI instead of quietly accumulating.
      - name: Lint
        run: cd web && npm run lint

  # Backend tests
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api -> target

      - name: Run Clippy
        run: cd api && cargo clippy -- -D warnings
        env:
          SQLX_OFFLINE: true

      - name: Run tests
        run: cd api && cargo test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/portal_test
          RUST_BACKTRACE: 1

  # Build check
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Frontend build
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Build frontend
        run: cd web && npm run build
        env:
          VITE_API_URL: http://localhost:3000

      # Backend build
      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api -> target

      - name: Build backend
        run: cd api && cargo build --release
        env:
          SQLX_OFFLINE: true
