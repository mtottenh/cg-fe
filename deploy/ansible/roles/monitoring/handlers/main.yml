---
- name: daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: restarted
    daemon_reload: true

- name: restart node exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    state: restarted
    daemon_reload: true

- name: restart postgres exporter
  ansible.builtin.systemd:
    name: prometheus-postgres-exporter
    state: restarted
    daemon_reload: true

- name: restart loki
  ansible.builtin.systemd:
    name: loki
    state: restarted
    daemon_reload: true

- name: restart alloy
  ansible.builtin.systemd:
    name: alloy
    state: restarted
    daemon_reload: true

- name: restart grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted
    daemon_reload: true
