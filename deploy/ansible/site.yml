---
# Top-level playbook, three plays:
#
#   1. Validate  — reject placeholder inventory/vault values before touching
#                  anything (runs under every --tags selection).
#   2. Backup    — pg_dump BEFORE the API deploy. Migrations are forward-only
#                  and auto-run on service start, so every deploy gets a
#                  seconds-old restore point (restore runbook: deploy/README.md).
#   3. Converge  — the roles. Order matters: base before postgres (user +
#                  firewall), postgres before backups/portal_api (DB must
#                  exist), the three portal services before caddy (upstreams
#                  up before fronting them), portal_web after caddy (the
#                  caddy user/docroot must exist before the SPA ships).

- name: Validate configuration
  hosts: all
  gather_facts: false
  become: false
  tags: [always]
  tasks:
    - name: Inventory values are not placeholders
      ansible.builtin.assert:
        that:
          - ansible_host is defined
          - "'CHANGE_ME' not in ansible_host"
          - portal_domain is defined
          - portal_domain != 'portal.example.com'
          - "'CHANGE_ME' not in portal_domain"
          - caddy_acme_email is defined
          - caddy_acme_email != 'ops@example.com'
          - "'CHANGE_ME' not in caddy_acme_email"
        fail_msg: >-
          inventory/prod.yml still contains placeholder values. Set
          ansible_host (run `just provision` to create the Linode and fill it
          in), portal_domain, and caddy_acme_email. See "Operator checklist"
          in deploy/README.md.

    - name: Required vault values are decrypted and not placeholders
      ansible.builtin.assert:
        that:
          - vault_postgres_password is defined
          - "'CHANGE_ME' not in vault_postgres_password"
          - vault_jwt_secret is defined
          - vault_jwt_secret | length >= 32
          - "'CHANGE_ME' not in vault_jwt_secret"
          - vault_linode_access_key is defined
          - "'CHANGE_ME' not in vault_linode_access_key"
          - vault_linode_secret_key is defined
          - "'CHANGE_ME' not in vault_linode_secret_key"
          - vault_steam_api_key is defined
          - "'CHANGE_ME' not in vault_steam_api_key"
        fail_msg: >-
          vault.yml is missing, not decrypted, or still contains CHANGE_ME
          placeholders. Create it with
          `ansible-vault create ansible/group_vars/all/vault.yml`
          using vault.example.yml as the key list ("Operator checklist" in
          deploy/README.md documents every key).

    # The scanner's API key can only be minted AFTER the first converge
    # (portal-cli api-key create needs a migrated DB), so it is required
    # only when the scanner is part of this run — asserting it
    # unconditionally would deadlock the tagged first converge. (This play
    # is tags:[always], so task tags can't scope it — gate on the selected
    # run tags instead.)
    - name: Scanner API key is set (when deploying the scanner)
      ansible.builtin.assert:
        that:
          - vault_portal_scanner_api_key is defined
          - "'CHANGE_ME' not in vault_portal_scanner_api_key"
        fail_msg: >-
          vault_portal_scanner_api_key still holds a placeholder. Mint it on
          the box (runbook step 7: portal-cli api-key create --service
          portal-scanner ...) and set it via `just edit-vault`.
      when: "'portal_scanner' in ansible_run_tags or 'all' in ansible_run_tags"

    - name: Backup encryption key is configured
      ansible.builtin.assert:
        that:
          - backup_age_public_key is defined
          - backup_age_public_key is match('^age1')
        fail_msg: >-
          backup_age_public_key is not set (group_vars/all/vars.yml).
          Off-box backups are age-encrypted; generate a keypair on the
          control machine with `age-keygen -o portal-backup.key`, store the
          private key in your password manager (NEVER on the box), and set
          the printed age1... public key.

- name: Pre-deploy database backup
  hosts: all
  become: true
  gather_facts: false
  # Tagged portal_api so every `just deploy` (--tags portal_api,...) snapshots
  # the DB before the new binary runs its migrations.
  tags: [portal_api, backups]
  tasks:
    - name: Check whether pg-backup is installed yet
      ansible.builtin.stat:
        path: /etc/systemd/system/pg-backup.service
      register: pg_backup_unit

    - name: Snapshot the database before deploying (blocks until the dump completes)
      ansible.builtin.systemd:
        name: pg-backup.service
        state: started
      when: pg_backup_unit.stat.exists

    - name: Note that no pre-deploy backup ran (first converge only)
      ansible.builtin.debug:
        msg: "pg-backup.service not installed yet — skipping pre-deploy backup (expected on the first converge)"
      when: not pg_backup_unit.stat.exists

- name: Converge portal host
  hosts: all
  become: true
  gather_facts: true

  roles:
    - role: base
      tags: [base]

    - role: postgres
      tags: [postgres]

    - role: backups
      tags: [backups]

    - role: portal_api
      tags: [portal_api]

    - role: portal_scanner
      tags: [portal_scanner]

    - role: portal_demo_stats
      tags: [portal_demo_stats]

    # Opt-in: the enricher needs a dedicated Steam bot account. Enable with
    # portal_steam_bot_enabled=true once the vault_steam_bot_* creds are set
    # (or use `just deploy-steam-bot <deb>`, which sets it for that run).
    - role: portal_steam_bot
      tags: [portal_steam_bot]
      when: portal_steam_bot_enabled | default(false)

    # Opt-in: Prometheus + Grafana + Loki + Alloy + exporters, all loopback
    # (docs/observability-design.md). Ordered before caddy so the grafana.<domain>
    # vhost (gated on the same flag inside Caddyfile.j2) renders in the same
    # converge. Requires vault_grafana_admin_password.
    - role: monitoring
      tags: [monitoring]
      when: monitoring_enabled | default(false)

    - role: caddy
      tags: [caddy]

    - role: portal_web
      tags: [portal_web]
