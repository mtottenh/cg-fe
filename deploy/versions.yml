# Release pins deployed by `just deploy-all`. One place to answer "what is
# (supposed to be) running in prod" — cross-check with `just installed`.
#
# Values are release tags (vX.Y.Z); empty string = skip that service.
# Remember: each repo's build-deb workflow refuses a tag that doesn't match
# its Cargo.toml/package version, so a published tag always names the real
# artifact version.

api: "v0.7.6"        # mtottenh/cg              — portal-api + portal-scanner debs
web: "v0.5.2"        # mtottenh/cg-fe           — portal-web deb
demo_stats: "v0.2.1" # mtottenh/csgo-demo-stats — portal-demo-stats deb
steam_bot: "v0.3.1"  # mtottenh/cg-steam-bot    — portal-steam-bot deb (Guard-page flow)
